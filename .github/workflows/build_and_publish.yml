# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build & Publish NuGet

on:
  workflow_dispatch:

jobs:
  build:
  
    env:
      BUILD_CONFIG: 'Release'

    runs-on: ubuntu-latest

    permissions:
      id-token: write # required to obtain the OIDC token for NuGet trusted publishing
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Pack
      run: dotnet pack --output nupkgs
    - name: NuGet login (trusted publishing)
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish
      run: dotnet nuget push nupkgs/*.nupkg --source 'https://api.nuget.org/v3/index.json' --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
